name: Publish

# A merge to main publishes a CalVer dev build (YYYY.0M.MICRO.devN) to
# TestPyPI. A published GitHub Release publishes that release to PyPI.
# Both use PyPI trusted publishing: no tokens are stored in the repository.
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the dev version
          persist-credentials: false

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: "latest"
          environments: build

      - name: Stamp dev version
        if: github.event_name == 'push'
        run: pixi run -e build python tools/release_version.py dev --write
        shell: bash

      - name: Check release tag matches pyproject.toml
        if: github.event_name == 'release'
        run: pixi run -e build python tools/release_version.py check-tag "$TAG"
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build sdist and wheel
        run: pixi run -e build build-dist
        shell: bash

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/roap
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a re-run of the same commit is not an error

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/roap
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
