name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            blacksmith-4vcpu-ubuntu-2404,
            blacksmith-6vcpu-macos-15,
            blacksmith-4vcpu-windows-2025,
          ]
      fail-fast: false
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: "latest"
          activate-environment: true

      - name: Install dependencies
        run: pixi install
        shell: bash

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key:
            pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml')
            }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit checks
        run: pixi run pre-commit-all
        shell: bash
        timeout-minutes: 10

      - name: Run test suite
        run: pytest -q --tb=short
        shell: bash
        env:
          OA_KEEP_PYTEST_RUNS: "1"

      # The suite above skips the GUI tests when there is no display.
      # Here a display is required: Linux gets a virtual one via Xvfb.
      - name: GUI smoke tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q xvfb
            xvfb-run -a pytest -q tests/test_gui_launcher.py
          else
            pytest -q tests/test_gui_launcher.py
          fi
        shell: bash
        env:
          ROAP_REQUIRE_GUI: "1"

      - name: Run full pipeline E2E
        run: ./run_pipeline.sh examples/example_data.xlsx outputs/ci_test
        shell: bash

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-output-${{ matrix.os }}
          path: |
            outputs/ci_test/oa_stage4_outputs/data/analysis_ready.csv
            outputs/ci_test/**/*.json
          retention-days: 7

      - name: Verify expected verdicts
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('outputs/ci_test/oa_stage4_outputs/data/analysis_ready.csv')
          verdicts = df['analysis_audit_status'].value_counts()
          print(verdicts)
          assert verdicts.get('FAIL', 0) == 3
          assert verdicts.get('REVIEW', 0) == 1
          assert verdicts.get('PASS', 0) >= 16
          "
        shell: bash
