name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: "latest"

      - name: Install dependencies
        run: pixi install
        shell: bash

      - name: Run pre-commit checks
        run: pixi run pre-commit-all
        shell: bash

      - name: Run test suite
        run: pytest -q --tb=short
        shell: bash
        env:
          OA_KEEP_PYTEST_RUNS: "1"

      - name: Run full pipeline E2E
        run: ./run_pipeline.sh examples/example_data.xlsx outputs/ci_test
        shell: bash

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ matrix.os }}
          path: |
            outputs/ci_test/oa_stage4_outputs/data/analysis_ready.csv
            outputs/ci_test/**/*.json
          retention-days: 7

      - name: Verify expected verdicts
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('outputs/ci_test/oa_stage4_outputs/data/analysis_ready.csv')
          verdicts = df['analysis_audit_status'].value_counts()
          print(verdicts)
          assert verdicts.get('FAIL', 0) == 3
          assert verdicts.get('REVIEW', 0) == 1
          assert verdicts.get('PASS', 0) >= 16
          "
        shell: bash