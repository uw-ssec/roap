[workspace]
# Project metadata and basic configuration
authors = ["University of Washington Scientific Software Engineering Center"] # Project authors
channels = ["conda-forge", "https://prefix.dev/lsetiawan/uw-ssec"] # Conda channels for dependencies; okf-agent-memory falls back to the second channel on platforms conda-forge doesn't build yet (osx-arm64, linux-aarch64)
name = "project-template" # Project name
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"] # Supported platforms for development and deployment
version = "0.1.0" # Project version

# The environment configurations for different development scenarios
[environments]
default = { features = ["pre-commit", "gh-cli", "okf"], solve-group = "default" } # The default development environment with pre-commit, GitHub CLI, and OKF agent memory
onboard = { features = ["pre-commit", "gh-cli", "onboard"], solve-group = "default" } # The onboarding environment with additional setup tasks

# The project dependencies
[dependencies]
python = ">=3.11,<3.12"
pandas = ">=2.2,<3.0"
numpy = ">=1.26,<2.5"
openpyxl = ">=3.1,<4.0"
matplotlib = ">=3.8,<4.0"
pyyaml = ">=6.0,<7.0"
pyarrow = ">=10.0,<20.0"
tabulate = ">=0.9,<0.11"
papermill = ">=2.4,<3.0"
pytest = ">=9.1.1,<10"
ipykernel = ">=6.0,<8.0"
ipython = ">=8.0,<10.0"
netcdf4 = ">=1.6,<2.0"
xarray = ">=2024.0,<2026.0"
pyco2sys = ">=1.8,<2.0"
hypothesis = ">=6.0,<7.0"
ruff = ">=0.5.0,<1.0"
black = ">=24.0,<25.0"
mypy = ">=1.10,<2.0"

# The project dependencies from PyPI
[pypi-dependencies]
# The pipeline itself, installed editable so Papermill subprocesses and the
# oa-pipeline console script can import oa_pipeline. pytest's pythonpath=["src"]
# only covers the test process, not the notebooks it shells out to.
oa-pipeline = { path = ".", editable = true }

# The main project tasks
[tasks]
pipeline = { cmd = "run_pipeline.sh", description = "Run the full OA pipeline on example data" }
test = { cmd = "pytest -q", description = "Run the test suite" }
pre-commit-all = { cmd = "pre-commit run --all-files", description = "Run all pre-commit checks" }
validate = { cmd = "oa-pipeline validate", description = "Pre-flight validation of input Excel" }
verify-bundle = { cmd = "oa-pipeline verify-bundle", description = "Verify run bundle integrity" }

# GitHub CLI feature for interacting with GitHub from the command line
[feature.gh-cli.dependencies]
gh = ">=2.0.0"

# OKF feature providing the `okf` agent-memory CLI
[feature.okf.dependencies]
okf-agent-memory = ">=0.4.0,<0.5"

[feature.okf.tasks]
okf-validate = { cmd = "okf validate knowledge --strict --drift", description = "Validate the OKF knowledge bundle" }
okf-search = { cmd = "okf search", description = "Search the OKF knowledge bundle: pixi run okf-search <query>" }

# Pre-commit feature for code quality and consistency
[feature.pre-commit.dependencies]
pre-commit = ">=4.3.0"

[feature.pre-commit.tasks]
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit hooks in the git repository" }
pre-commit-all = { cmd = "pre-commit run --all-files", description = "Run pre-commit checks on all files" }
pre-commit = { cmd = "pre-commit run", description = "Run pre-commit checks on staged files" }

# Onboarding feature for setting up the development environment
[feature.onboard.pypi-dependencies]
ssec-cli = { git = "https://github.com/uw-ssec/ssec-cli.git" }

[feature.onboard.tasks]
ssec-setup = { cmd = "ssec --install-completion", description = "Set up shell completion for ssec-cli" }
onboard = { cmd = "ssec onboard", description = "Run the onboarding process for the SSEC project", depends-on = [
    "pre-commit-install",
    "ssec-setup",
] }
